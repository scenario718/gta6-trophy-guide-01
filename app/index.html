<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07060e">
<title>Leonida Night Ledger — GTA VI trophies</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
        <rect x="3" y="3" width="42" height="42" rx="10" fill="none" stroke="url(#markstroke)" stroke-width="2.5"/>
        <path d="M16 34 V14 H33" fill="none" stroke="#5dffe8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <defs>
          <linearGradient id="markstroke" x1="0" y1="0" x2="48" y2="48">
            <stop offset="0" stop-color="#5dffe8"/>
            <stop offset="1" stop-color="#ff3d8a"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="brand-copy">
        <p class="eyebrow">Leonida · offline ledger</p>
        <h1>Night Ledger</h1>
        <p class="makeup" id="makeup">55 trophies · 1 platinum · 2 gold · 6 silver · 46 bronze</p>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="toolbar">
    <nav class="views" aria-label="Views">
      <button type="button" id="view-checklist" data-view="checklist">Checklist</button>
      <button type="button" id="view-roadmap" data-view="roadmap">Roadmap</button>
    </nav>
    <label class="search">
      <span class="sr">Search trophies</span>
      <input id="q" type="search" placeholder="Search name, description, guide" autocomplete="off">
    </label>
    <label class="spoiler-toggle">
      <input id="spoilers" type="checkbox">
      <span>Hide story spoilers</span>
    </label>
    <button type="button" id="export">Export</button>
    <label class="file-btn">Import<input id="import" type="file" accept="application/json"></label>
  </div>
  <div class="filters">
    <div class="pills" id="kinds" role="group" aria-label="Filter by kind"></div>
    <label class="grade">Grade
      <select id="grade">
        <option value="all">All grades</option>
        <option value="platinum">Platinum</option>
        <option value="gold">Gold</option>
        <option value="silver">Silver</option>
        <option value="bronze">Bronze</option>
      </select>
    </label>
    <p class="shown" id="shown"></p>
  </div>
  <div class="workspace">
    <main id="list"></main>
    <aside id="detail" aria-live="polite"></aside>
  </div>
  <p class="toast" id="toast" hidden></p>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
